name: QuickChat Java CI

on:
  push:
    branches:
      - main
      - "**"

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Step 3: Check Java version
      - name: Check Java version
        run: java -version

      # Step 4: Compile the project
      - name: Compile QuickChat
        run: mvn -B clean compile

      # Step 5: Run JUnit tests
      - name: Run QuickChat tests
        run: mvn -B test

      # Step 6: Create the JAR file
      - name: Package QuickChat
        run: mvn -B package
