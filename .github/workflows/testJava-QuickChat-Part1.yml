

name: QuickChat Java CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Check Java version
        run: java -version

      - name: Compile QuickChat
        run: mvn -B clean compile

      - name: Run QuickChat tests
        run: mvn -B test

      - name: Package QuickChat
        run: mvn -B package
